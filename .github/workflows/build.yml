name: CI Pipeline

on:
  pull_request:
    branches: ["main"]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check code format
        run: find . -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror

  build:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with make
        run: make
          
    
        