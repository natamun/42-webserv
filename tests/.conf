server {
    listen 8080;
    host 127.0.0.1;
    root www;
    client_max_body_size 10000000;

    location / {
        index index.html;
        allow_methods GET;
    }

    location /images {
        allow_methods GET;
        autoindex on;
    }

    location /upload {
        allow_methods POST DELETE;
        upload_path www/upload;
    }
}