# curl --resolve site-a.local:8080:127.0.0.1 http://site-a.local:8080/
server {
    listen 8080;
    host 127.0.0.1;
    server_name site-a.local;
    root www;

    location / {
        allow_methods GET;
        root www;
        index index.html;
        autoindex off;
    }
}

# curl --resolve site-b.local:8081:127.0.0.1 http://site-b.local:8081/
server {
    listen 8081;
    host 127.0.0.1;
    server_name site-b.local;
    root www2;

    location / {
        allow_methods GET;
        root www2;
        index index.html;
        autoindex off;
    }
}
