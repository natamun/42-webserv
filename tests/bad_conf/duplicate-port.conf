server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    root www;

    location / {
        allow_methods GET;
        root www;
        index index.html;
    }
}

server {
    listen 8080;
    host 127.0.0.1;
    server_name other;
    root www2;

    location / {
        allow_methods GET;
        root www2;
        index index.html;
    }
}
