server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;
    root www;
    client_max_body_size 10000000;
    error_page 404 www/errors/404.html;
    error_page 500 www/errors/500.html;

    location / {
        allow_methods GET;
        root www;
        index index.html;
        autoindex off;
    }

    location /old-home {
        allow_methods GET;
        return /;
    }

    location /images {
        allow_methods GET;
        root www/images;
        autoindex on;
    }

    location /upload {
        allow_methods GET POST DELETE;
        root www/upload;
        upload_path www/upload;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root cgi-bin;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
    }
}
