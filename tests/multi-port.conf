server {
    listen 8080;
    host 127.0.0.1;
    server_name 127.0.0.1;
    root www;

    location / {
        allow_methods GET;
        root www;
        index index.html;
        autoindex off;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    server_name 127.0.0.1;
    root www2;

    location / {
        allow_methods GET;
        root www2;
        index index.html;
        autoindex off;
    }
}
